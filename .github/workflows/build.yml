# Eseguibili del gioco (Electron) per Windows e Linux: si costruiscono a ogni push su claude/lampara e su
# richiesta; gli installer finiscono negli artifact del workflow.
name: build

on:
  push:
    branches: [claude/lampara, main]
  workflow_dispatch:

jobs:
  dist:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: splashland-${{ runner.os }}
          path: |
            release/*.exe
            release/*.zip
            release/*.AppImage
            release/*.tar.gz
          if-no-files-found: warn
