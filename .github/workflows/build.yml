# Eseguibili del gioco (Electron) per Windows e Linux: si costruiscono su richiesta (Actions → build →
# Run workflow) e per i tag di versione (v0.2.0…); gli installer finiscono negli artifact del workflow.
# Con «ultima_notte» = 2 la build è la demo delle prime due notti, senza la notte extra (VITE_ULTIMA_NOTTE, vedi
# src/app/app.ts) e senza i file delle notti dopo (scripts/demo.ts); c'è anche da giocare nel browser, per itch.io
# (l'artifact SplashlandIsClosed-web).
# «scorciatoie» (accesa di base quando la build si lancia a mano) mette le scorciatoie da tastiera per le prove: le
# notti, la vittoria e i jumpscare (src/app/prove.ts). Per la build che va al pubblico va spenta; nelle build dei tag
# di versione non c'è mai.
name: build

on:
  workflow_dispatch:
    inputs:
      ultima_notte:
        description: 'Fino a che notte arriva la build (vuoto = tutte, 2 = la demo delle prime due notti)'
        required: false
        default: ''
      scorciatoie:
        description: 'Scorciatoie di prova (Alt+numero, Alt+V, Alt+Maiusc+numero): spegnerle per la build del pubblico'
        type: boolean
        required: false
        default: true
  push:
    tags: ['v*']

jobs:
  dist:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_ULTIMA_NOTTE: ${{ inputs.ultima_notte }}
          # vuoto nei tag di versione (lì gli input non ci sono): niente scorciatoie
          VITE_SCORCIATOIE: ${{ inputs.scorciatoie && '1' || '' }}
      - run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Windows: la cartella del gioco pronta da estrarre e aprire (un solo zip da scaricare) e, a parte,
      # l'installer
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: SplashlandIsClosed-windows-portatile
          path: release/win-unpacked/
          if-no-files-found: error
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: SplashlandIsClosed-windows-installer
          path: release/*.exe
          if-no-files-found: warn
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: SplashlandIsClosed-linux
          path: |
            release/*.AppImage
            release/*.tar.gz
          if-no-files-found: warn
      # la demo da giocare nel browser (itch.io): la cartella dist/ con index.html in cima, come la vuole itch per i
      # giochi HTML. Solo per le build che si fermano a una notte (la demo), mai per il gioco intero
      - if: runner.os == 'Linux' && inputs.ultima_notte != ''
        uses: actions/upload-artifact@v4
        with:
          name: SplashlandIsClosed-web
          path: dist/
          if-no-files-found: error
